# ============================================================
# Hostel Room Allocation System - Database Configuration
# ============================================================
#
# IMPORTANT: Do NOT commit this file to Git.
#            It is listed in .gitignore for security.
#
# Edit the values below to match your local MySQL setup.
# ============================================================

# JDBC connection URL
# - localhost     : MySQL is running on the same machine
# - 3306          : default MySQL port
# - hostel_db     : the database we will create in Phase 2
# - useSSL=false  : disables SSL (safe for local development)
# - allowPublicKeyRetrieval=true : required by MySQL 8.x
db.url=jdbc:mysql://localhost:3306/hostel_management?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

# MySQL username (usually root for local development)
db.username=root

# Replace this with your actual MySQL root password.
# If you set no password, leave blank: db.password=
db.password=saurabh@vish17

# JDBC driver class for MySQL 8.x (do not change)
db.driver=com.mysql.cj.jdbc.Driver
